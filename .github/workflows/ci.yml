name: ci
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      # 本仓 .npmrc 把 pnpm store 指向本机 Windows 绝对路径，Linux runner 上必须覆盖，
      # 否则 pnpm 会在仓库内建出一个形如 "D:\code\agent_mobile\.pnpm-store" 的怪目录
      npm_config_store_dir: /tmp/pnpm-store
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck